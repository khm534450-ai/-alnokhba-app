
name: Build ELITE Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare web application
        run: |
          mkdir -p www
          cp index.html www/index.html
          cp manifest.json www/manifest.json
          cp content.json www/content.json
          cp sw.js www/sw.js
          if [ -d icons ]; then cp -r icons www/icons; fi

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@^8 @capacitor/android@^8
          npm install --save-dev @capacitor/cli@^8

      - name: Configure Capacitor
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "app.elite.nokhba",
            "appName": "ELITE | النخبة",
            "webDir": "www"
          }
          EOF

      - name: Create Android project
        run: npx cap add android

      - name: Sync Android project
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ELITE-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
