
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080808">
<meta name="description" content="ELITE - النخبة التعليمية للبكالوريا السورية">
<link rel="manifest" href="./manifest.json">
<title>ELITE | النخبة</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Cairo:wght@400;600;700&family=Tajawal:wght@400;500;700&family=Noto+Naskh+Arabic:wght@400;600&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root{
--bg:#080808;--card:#151515;--border:#3b3020;
--text:#f7f3e9;--muted:#a99d85;--gold:#d6b46b;
--input:#0b0b0b;--font:'IBM Plex Sans Arabic';
}
body.light{
--bg:#f6f1e6;--card:#fff;--border:#e5dcc6;
--text:#241c0e;--muted:#7a6d52;--input:#faf6ec;--gold:#9a7424;
}
*{box-sizing:border-box}
body{
margin:0;background:var(--bg);color:var(--text);
font-family:var(--font),Tahoma,sans-serif;
line-height:1.7;padding-bottom:90px;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
outline:2px solid var(--gold);outline-offset:2px
}
#app{max-width:650px;margin:auto;padding:14px}
h1,h2,h3{margin:0;line-height:1.5}
h2{color:var(--gold);font-size:1.15rem}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
.logo{font-weight:700;font-size:1.35rem;color:var(--gold)}
.logo small{display:block;font-size:.7rem;color:var(--muted);font-weight:400}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:10px}
.hero{background:linear-gradient(130deg,#352817,#111);color:#f7f3e9}
.hero h1{color:#d6b46b;font-size:1.3rem}
.hero p{margin:4px 0 0;color:#cfc4a8;font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:10px}
.tile{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;text-align:start;display:flex;gap:10px;align-items:center;width:100%;color:var(--text)}
.tile span{font-size:1.5rem}
.btn{background:linear-gradient(120deg,#f1dba4,#b88c42);color:#17120a;border-radius:11px;padding:10px 16px;font-weight:700;border:0}
.btn.light{background:var(--input);color:var(--text);border:1px solid var(--border)}
.btn.red{background:#b84a4a;color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>.btn{flex:1}
input,select,textarea{width:100%;background:var(--input);border:1px solid var(--border);border-radius:11px;padding:10px;margin:0 0 8px;color:var(--text)}
textarea{min-height:110px;resize:vertical}
input[type=checkbox]{width:auto}
.muted{color:var(--muted);font-size:.85rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0;text-align:center}
.stats b{display:block;font-size:1.3rem;color:var(--gold)}
.section{display:flex;justify-content:space-between;margin:14px 0 8px;font-weight:700}
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:7px 0 calc(8px + env(safe-area-inset-bottom));z-index:5}
.nav button{background:none;color:var(--muted);font-size:.7rem;padding:2px 6px;border:0}
.nav button.active{color:var(--gold)}
.nav span{display:block;font-size:1.3rem}
details{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px;margin-bottom:8px}
summary{font-weight:700;cursor:pointer}
.read{margin:10px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.timer{font-size:2.8rem;font-weight:700;text-align:center;color:var(--gold);margin:14px 0;font-variant-numeric:tabular-nums}
.video{display:flex;gap:10px;align-items:center}
.video img{width:96px;height:54px;object-fit:cover;border-radius:10px;background:var(--border)}
.embed{position:relative;padding-top:56.25%;margin-bottom:10px;border-radius:12px;overflow:hidden}
.embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.done{text-decoration:line-through;color:var(--muted)}
.note{background:#211b11;border-right:3px solid var(--gold);padding:10px;font-size:.85rem}
@media(min-width:650px){.grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>

<body>
<div id="app"></div>
<nav class="nav" id="nav"></nav>

<script>
"use strict";

const SUBJECTS={
 sci:[
 ["math","الرياضيات","Mathematics","🧮"],
 ["physics","الفيزياء","Physics","⚛️"],
 ["chem","الكيمياء","Chemistry","🧪"],
 ["bio","علم الأحياء","Biology","🌿"],
 ["arabic","اللغة العربية","Arabic","📖"],
 ["english","اللغة الإنكليزية","English","🔤"],
 ["french","اللغة الفرنسية","French","🗣️"],
 ["relig","التربية الدينية","Religion","🕌"]
 ],
 lit:[
 ["history","التاريخ","History","⏳"],
 ["geo","الجغرافيا","Geography","🌍"],
 ["phil","الفلسفة","Philosophy","💡"],
 ["socio","علم الاجتماع","Sociology","👥"],
 ["arabic","اللغة العربية","Arabic","📖"],
 ["english","اللغة الإنكليزية","English","🔤"],
 ["french","اللغة الفرنسية","French","🗣️"],
 ["relig","التربية الدينية","Religion","🕌"]
 ]
};

const FONTS={
 plex:["IBM Plex Sans Arabic","'IBM Plex Sans Arabic'"],
 cairo:["Cairo","Cairo"],
 tajawal:["Tajawal","Tajawal"],
 naskh:["Noto Naskh Arabic","'Noto Naskh Arabic'"]
};

const WORDS={
 home:"الرئيسية",review:"المراجعة",timer:"المؤقت",tasks:"المهام",
 settings:"الإعدادات",subjects:"المواد الدراسية",today:"اليوم",
 due:"مراجعات مستحقة",research:"الأبحاث والملخصات",addResearch:"إضافة بحث",
 title:"العنوان",text:"النص",save:"حفظ",edit:"تعديل",delete:"حذف",
 cancel:"إلغاء",search:"ابحث في الأبحاث",noResearch:"لا توجد أبحاث بعد",
 videos:"الفيديوهات",videoTitle:"عنوان الفيديو",videoURL:"رابط الفيديو",
 videoNote:"ملاحظة اختيارية",saveVideo:"حفظ الفيديو",play:"تشغيل",
 close:"إغلاق",open:"فتح الرابط",lesson:"إضافة درس للمراجعة",
 question:"السؤال أو عنوان الدرس",answer:"الجواب أو الفكرة",
 addReview:"إضافة للمراجعة",noDue:"أنهيت مراجعات اليوم 🎉",
 showAnswer:"إظهار الإجابة",forgot:"لم أتذكر",hard:"بصعوبة",easy:"أتقنتها",
 start:"بدء الجلسة",stop:"إيقاف الجلسة",newTask:"مهمة جديدة",
 add:"إضافة",noTasks:"لا توجد مهام.",exam:"تاريخ الامتحان",
 goal:"الهدف اليومي بالساعات",font:"نوع الخط",fontSize:"حجم الخط",
 language:"اللغة",theme:"المظهر",dark:"داكن",light:"فاتح",
 small:"صغير",medium:"متوسط",large:"كبير",backup:"النسخة الاحتياطية",
 export:"تصدير",import:"استيراد",backupNote:"بياناتك محفوظة على هذا الجهاز فقط. احتفظ بنسخة احتياطية.",
 student:"اسم الطالب",choose:"اكتب اسمك واختر فرعك",
 scientific:"البكالوريا العلمي",literary:"البكالوريا الأدبي",
 welcome:"أهلاً بك يا ",left:"يوم للامتحان",
 assistant:"مساعد المادة",paste:"الصق نص الدرس هنا أو ارفع ملفاً",
 listen:"قراءة صوتية",generate:"توليد أسئلة",cards:"بطاقات تفاعلية",
 saveResearch:"حفظ كبحث",noAI:"هذه النسخة لا تتصل بخدمة ذكاء اصطناعي.",
 hint:"سجّل دروسك من صفحة المادة.",speed:"سرعة القراءة",
 slow:"بطيئة",normal:"عادية",fast:"سريعة",dictation:"إملاء صوتي",
 official:"رسمي",mine:"خاص بي",editor:"محرر المحتوى المحلي",
 editorNote:"المحرر المحلي ليس نظام حماية آمناً.",
 need:"أدخل العنوان والنص",needVideo:"أدخل عنواناً ورابطاً صحيحاً يبدأ بـ https://",
 all:"الكل"
};

const KEY="ELITE_FIXED_V3";

function fresh(){
 return {
  name:"",branch:"",exam:"",goal:3,theme:"dark",lang:"ar",
  font:"plex",fontSize:1,rate:1,
  research:{},videos:[],lessons:[],tasks:[],
  sessions:[],activeTimer:0,timerDay:"",editor:false
 };
}

function normalize(x){
 const d=fresh();
 if(!x||typeof x!=="object")return d;
 Object.assign(d,x);
 if(!d.research||typeof d.research!=="object")d.research={};
 for(const k of ["videos","lessons","tasks","sessions"])
  if(!Array.isArray(d[k]))d[k]=[];
 if(!["sci","lit",""].includes(d.branch))d.branch="";
 if(!["ar","en"].includes(d.lang))d.lang="ar";
 if(!FONTS[d.font])d.font="plex";
 d.goal=Math.max(1,Math.min(14,Number(d.goal)||3));
 d.fontSize=[.9,1,1.1,1.2].includes(Number(d.fontSize))?Number(d.fontSize):1;
 return d;
}

function load(){
 try{return normalize(JSON.parse(localStorage.getItem(KEY)||"null"))}
 catch(e){return fresh()}
}

let D=load();
let VIEW="home",SUBJECT=null,EDIT=null,SHOW=false,EMBED=null;
let AI={text:"",questions:[],index:0,score:0,selected:-1,mode:""};
let timerInterval=null;

const $=id=>document.getElementById(id);
const t=k=>WORDS[k]||k;

function esc(s){
 return String(s??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

function save(){
 try{localStorage.setItem(KEY,JSON.stringify(D))}
 catch(e){alert("مساحة التخزين غير كافية. صدّر نسخة احتياطية.")}
}

function dayNumber(date=new Date()){
 return Math.floor(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate())/86400000);
}

function todayKey(){
 const d=new Date();
 return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

function subjectName(id){
 const s=(SUBJECTS[D.branch]||[]).find(x=>x[0]===id);
 return s?s[1]:id;
}

function applySettings(){
 document.documentElement.lang=D.lang;
 document.documentElement.dir=D.lang==="ar"?"rtl":"ltr";
 document.body.className=D.theme==="light"?"light":"";
 document.body.style.setProperty("--font",FONTS[D.font][1]);
 document.documentElement.style.fontSize=(16*D.fontSize)+"px";
}

function header(title,back=false){
 return `<div class="top">
 <div class="logo">${back?'<button class="btn light" onclick="go(\\'home\\')">←</button> ':""}${esc(title)}
 <small>ELITE | النخبة التعليمية</small></div>
 <span class="muted">${esc(D.name)}</span></div>`;
}

function go(view,subject=null){
 VIEW=view;SUBJECT=subject;EDIT=null;EMBED=null;SHOW=false;
 if(view==="assistant")AI={text:"",questions:[],index:0,score:0,selected:-1,mode:""};
 draw();window.scrollTo(0,0);
}

function chooseBranch(branch){
 D.name=$("studentName").value.trim()||"طالب";
 D.branch=branch;save();draw();
}

function draw(){
 applySettings();
 const app=$("app"),nav=$("nav");

 if(!D.branch){
  nav.style.display="none";
  app.innerHTML=`
  <div style="text-align:center;padding:30px 0">
   <div class="logo" style="font-size:2.2rem">ELITE</div>
   <h2>النخبة التعليمية</h2>
   <p class="muted">${t("choose")}</p>
  </div>
  <input id="studentName" placeholder="${t("student")}">
  <button class="tile" onclick="chooseBranch('sci')">⚛️ <b>${t("scientific")}</b></button>
  <button class="tile" style="margin-top:8px" onclick="chooseBranch('lit')">📚 <b>${t("literary")}</b></button>`;
  return;
 }

 nav.style.display="flex";
 nav.innerHTML=[
 ["home","🏠"],["review","🔁"],["timer","⏱️"],["tasks","✅"],["settings","⚙️"]
 ].map(x=>`<button class="${VIEW===x[0]?"active":""}" onclick="go('${x[0]}')"><span>${x[1]}</span>${t(x[0])}</button>`).join("");

 const pages={
 home:homePage,subject:subjectPage,assistant:assistantPage,
 review:reviewPage,timer:timerPage,tasks:tasksPage,
 settings:settingsPage,subjects:subjectsPage
 };
 app.innerHTML=(pages[VIEW]||homePage)();
}

function subjects(){return SUBJECTS[D.branch]||[]}

function homePage(){
 const left=D.exam?Math.max(0,Math.ceil((new Date(D.exam+"T00:00:00")-new Date(new Date().toDateString()))/86400000)):"--";
 const done=D.tasks.filter(x=>x.done).length;
 return header("النخبة")+`
 <div class="card hero">
  <h1>${t("welcome")}${esc(D.name)}</h1>
  <p>${left} ${t("left")}</p>
  <div class="stats">
   <div><b>${formatTime(elapsedToday())}</b>${t("today")}</div>
   <div><b>${done}/${D.tasks.length}</b>${t("tasks")}</div>
   <div><b>${dueLessons().length}</b>${t("due")}</div>
  </div>
 </div>
 <div class="section">${t("subjects")}</div>
 <div class="grid">
 ${subjects().map(s=>`<button class="tile" onclick="go('subject','${s[0]}')"><span>${s[3]}</span><b>${s[1]}</b></button>`).join("")}
 </div>
 <div class="grid">
 <button class="tile" onclick="go('review')">🔁 <b>${t("review")}</b></button>
 <button class="tile" onclick="go('timer')">⏱️ <b>${t("timer")}</b></button>
 <button class="tile" onclick="go('tasks')">✅ <b>${t("tasks")}</b></button>
 <button class="tile" onclick="go('settings')">⚙️ <b>${t("settings")}</b></button>
 </div>`;
}

function subjectsPage(){
 return header(t("subjects"))+`<div class="grid">${subjects().map(s=>`
 <button class="tile" onclick="go('subject','${s[0]}')"><span>${s[3]}</span><b>${s[1]}</b></button>`).join("")}</div>`;
}

/* الأبحاث */

function subjectPage(){
 const id=SUBJECT,list=D.research[id]||(D.research[id]=[]);
 const edit=EDIT!==null?list[EDIT]:null;
 const videos=D.videos.filter(v=>v.subject===id);

 return header(subjectName(id),true)+`
 <button class="tile" onclick="go('assistant','${id}')">🤖 <b>${t("assistant")}</b></button>
 <div class="section">${t("research")}</div>
 <input placeholder="${t("search")}" oninput="filterResearch(this.value)">
 <div id="researchList">
 ${list.length?list.map((r,i)=>`
 <details class="researchItem">
 <summary>${esc(r.title)} <span class="muted">${r.official?t("official"):t("mine")}</span></summary>
 <div class="read">${esc(r.text)}</div>
 <div class="row">
 <button class="btn light" onclick="speakResearch(${i})">🔊 ${t("listen")}</button>
 ${!r.official||D.editor?`<button class="btn light" onclick="editResearch(${i})">${t("edit")}</button>
 <button class="btn red" onclick="deleteResearch(${i})">${t("delete")}</button>`:""}
 </div></details>`).join(""):`<p class="muted">${t("noResearch")}</p>`}
 </div>
 <div class="card">
 <h2>${edit?t("edit"):t("addResearch")}</h2>
 <input id="researchTitle" placeholder="${t("title")}" value="${esc(edit?.title||"")}">
 <textarea id="researchText" placeholder="${t("text")}">${esc(edit?.text||"")}</textarea>
 <button class="btn light" onclick="dictate('researchText')">🎤 ${t("dictation")}</button>
 <div class="row">
 <button class="btn" onclick="saveResearch()">${t("save")}</button>
 ${edit?`<button class="btn light" onclick="EDIT=null;draw()">${t("cancel")}</button>`:""}
 </div></div>
 <div class="section">🎬 ${t("videos")}</div>
 ${videos.map(v=>`
 <div class="card">
 ${EMBED===v.id&&v.youtube?`<div class="embed"><iframe src="https://www.youtube-nocookie.com/embed/${v.youtube}" allowfullscreen loading="lazy"></iframe></div>`:""}
 <div class="video">${v.youtube?`<img src="https://i.ytimg.com/vi/${v.youtube}/mqdefault.jpg" alt="">`:"▶️"}
 <div><b>${esc(v.title)}</b><div class="muted">${esc(v.note||"")}</div></div></div>
 <div class="row" style="margin-top:8px">
 ${v.youtube?`<button class="btn" onclick="toggleEmbed('${v.id}')">${EMBED===v.id?t("close"):t("play")}</button>`:""}
 <button class="btn light" onclick="openVideo('${v.id}')">${t("open")}</button>
 <button class="btn red" onclick="deleteVideo('${v.id}')">🗑</button>
 </div></div>`).join("")}
 <div class="card">
 <input id="videoTitle" placeholder="${t("videoTitle")}">
 <input id="videoURL" type="url" dir="ltr" placeholder="${t("videoURL")}">
 <input id="videoNote" placeholder="${t("videoNote")}">
 <button class="btn" onclick="addVideo('${id}')">${t("saveVideo")}</button>
 </div>
 <div class="section">${t("lesson")}</div>
 <div class="card">
 <input id="lessonTitle" placeholder="${t("question")}">
 <textarea id="lessonAnswer" placeholder="${t("answer")}"></textarea>
 <button class="btn light" onclick="dictate('lessonAnswer')">🎤 ${t("dictation")}</button>
 <button class="btn" onclick="addLesson('${id}')">${t("addReview")}</button>
 </div>`;
}

function filterResearch(q){
 document.querySelectorAll(".researchItem").forEach(el=>{
  el.style.display=el.textContent.toLowerCase().includes(q.toLowerCase())?"":"none";
 });
}

function saveResearch(){
 const title=$("researchTitle").value.trim(),text=$("researchText").value.trim();
 if(!title||!text)return alert(t("need"));
 const list=D.research[SUBJECT]||(D.research[SUBJECT]=[]);
 if(EDIT!==null)Object.assign(list[EDIT],{title,text});
 else list.push({id:String(Date.now()),title,text,official:false});
 EDIT=null;save();draw();
}
function editResearch(i){EDIT=i;draw()}
function deleteResearch(i){
 if(!confirm("حذف البحث؟"))return;
 D.research[SUBJECT].splice(i,1);save();draw();
}

/* الفيديوهات */

function youtubeId(url){
 try{
  const u=new URL(url);
  if(u.hostname==="youtu.be")return u.pathname.slice(1).split("/")[0];
  if(["youtube.com","www.youtube.com","m.youtube.com"].includes(u.hostname)){
   if(u.searchParams.get("v"))return u.searchParams.get("v");
   const m=u.pathname.match(/\/(?:embed|shorts)\/([\w-]{11})/);
   return m?m[1]:"";
  }
 }catch(e){}
 return "";
}
function addVideo(subject){
 const title=$("videoTitle").value.trim(),url=$("videoURL").value.trim();
 if(!title)return alert(t("needVideo"));
 let u;
 try{u=new URL(url)}catch(e){return alert(t("needVideo"))}
 if(u.protocol!=="https:")return alert(t("needVideo"));
 D.videos.push({id:String(Date.now()),subject,title,url,note:$("videoNote").value.trim(),youtube:youtubeId(url)});
 save();draw();
}
function toggleEmbed(id){EMBED=EMBED===id?null:id;draw()}
function openVideo(id){
 const v=D.videos.find(x=>x.id===id);
 if(v)window.open(v.url,"_blank","noopener,noreferrer");
}
function deleteVideo(id){
 if(!confirm("حذف الفيديو؟"))return;
 D.videos=D.videos.filter(v=>v.id!==id);save();draw();
}

/* المراجعة */

function addLesson(subject){
 const title=$("lessonTitle").value.trim(),answer=$("lessonAnswer").value.trim();
 if(!title)return alert(t("need"));
 D.lessons.push({id:String(Date.now()),subject,title,answer,box:0,next:dayNumber()+1});
 save();draw();
}
function dueLessons(){return D.lessons.filter(l=>Number(l.next)<=dayNumber())}
function reviewPage(){
 const list=dueLessons(),l=list[0];
 if(!l)return header(t("review"))+`<div class="card" style="text-align:center"><h3>${t("noDue")}</h3></div>`;
 return header(t("review"))+`
 <p class="muted">${list.length} ${t("due")}</p>
 <div class="card" style="text-align:center">
 <div class="muted">${esc(subjectName(l.subject))}</div>
 <h3 style="margin:12px 0">${esc(l.title)}</h3>
 ${SHOW?`<div class="read">${esc(l.answer||"—")}</div>`:
 `<button class="btn light" onclick="SHOW=true;draw()">${t("showAnswer")}</button>`}
 </div>
 ${SHOW?`<div class="row">
 <button class="btn red" onclick="rateReview(0)">${t("forgot")}</button>
 <button class="btn light" onclick="rateReview(1)">${t("hard")}</button>
 <button class="btn" onclick="rateReview(2)">${t("easy")}</button>
 </div>`:""}`;
}
function rateReview(level){
 const l=dueLessons()[0];if(!l)return;
 const intervals=[1,3,7,14,30];
 if(level===0)l.box=0;
 else if(level===2)l.box=Math.min(4,(l.box||0)+1);
 let days=intervals[l.box||0];
 if(level===1)days=Math.max(1,Math.floor(days/2));
 l.next=dayNumber()+days;SHOW=false;save();draw();
}

/* الصوت */

function speak(text){
 if(!("speechSynthesis" in window))return alert("الصوت غير مدعوم في هذا المتصفح");
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(text);
 u.lang=/[\u0600-\u06FF]/.test(text)?"ar-SA":"en-US";
 u.rate=Number(D.rate)||1;speechSynthesis.speak(u);
}
function speakResearch(i){
 const r=D.research[SUBJECT][i];if(r)speak(r.title+". "+r.text);
}
function dictate(id){
 const R=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!R)return alert("الإملاء الصوتي غير مدعوم على جهازك");
 const rec=new R();rec.lang="ar-SA";
 rec.onresult=e=>$(id).value+=" "+e.results[0][0].transcript;
 rec.start();
}

/* المساعد المحلي */

function assistantPage(){
 return header(t("assistant")+" · "+subjectName(SUBJECT),true)+`
 <div class="card">
 <textarea id="assistantText" placeholder="${t("paste")}" oninput="AI.text=this.value">${esc(AI.text)}</textarea>
 <input type="file" accept=".txt,.pdf" onchange="readStudyFile(this)">
 </div>
 <div class="grid">
 <button class="btn light" onclick="readAssistant()">🎧 ${t("listen")}</button>
 <button class="btn light" onclick="generateQuestions()">❓ ${t("generate")}</button>
 <button class="btn light" onclick="saveAssistant()">💾 ${t("saveResearch")}</button>
 </div>
 <p class="muted">${t("noAI")}</p>
 ${renderQuestions()}`;
}
function readStudyFile(input){
 const file=input.files?.[0];if(!file)return;
 if(file.size>15*1024*1024)return alert("حجم الملف كبير");
 if(file.name.toLowerCase().endsWith(".pdf")){
  const reader=new FileReader();
  reader.onload=()=>{
   loadPDF(()=>{
    pdfjsLib.getDocument({data:reader.result}).promise.then(async pdf=>{
     let text="";
     for(let i=1;i<=Math.min(pdf.numPages,40);i++){
      const page=await pdf.getPage(i),content=await page.getTextContent();
      text+=content.items.map(x=>x.str).join(" ")+"\n";
     }
     AI.text=text;draw();
    }).catch(()=>alert("تعذر قراءة PDF"));
   });
  };
  reader.readAsArrayBuffer(file);
 }else{
  const reader=new FileReader();
  reader.onload=()=>{AI.text=String(reader.result||"");draw()};
  reader.readAsText(file);
 }
}
function loadPDF(cb){
 if(window.pdfjsLib)return cb();
 const base="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
 const s=document.createElement("script");s.src=base+"pdf.min.js";
 s.onload=()=>{pdfjsLib.GlobalWorkerOptions.workerSrc=base+"pdf.worker.min.js";cb()};
 s.onerror=()=>alert("تعذر تحميل قارئ PDF");
 document.head.appendChild(s);
}
function readAssistant(){
 const text=$("assistantText")?.value||AI.text;
 if(text)speak(text.slice(0,12000));
}
function saveAssistant(){
 const text=$("assistantText").value.trim();if(!text)return;
 (D.research[SUBJECT]||(D.research[SUBJECT]=[])).push({
  id:String(Date.now()),title:text.slice(0,45),text,official:false
 });
 save();alert("تم الحفظ");
}
function generateQuestions(){
 AI.text=$("assistantText").value.trim();
 if(AI.text.length<80)return alert("أضف نصاً أطول");
 const sentences=AI.text.replace(/([.!؟?])\s+/g,"$1\n").split("\n")
 .map(x=>x.trim()).filter(x=>x.split(/\s+/).length>=6);
 const words=[...new Set(AI.text.split(/[\s،,.;:؟!?()]+/).filter(w=>w.length>=4))];
 const result=[];
 sentences.sort(()=>Math.random()-.5);
 for(const sentence of sentences){
  if(result.length>=8)break;
  const answer=sentence.split(/[\s،,.;:؟!?()]+/).filter(w=>w.length>=5).sort((a,b)=>b.length-a.length)[0];
  if(!answer)continue;
  const wrong=words.filter(w=>w!==answer&&Math.abs(w.length-answer.length)<=3).sort(()=>Math.random()-.5).slice(0,3);
  if(wrong.length<3)continue;
  const options=[answer,...wrong].sort(()=>Math.random()-.5);
  result.push({question:sentence.replace(answer,"_____"),options,correct:options.indexOf(answer)});
 }
 if(!result.length)return alert("لم أستطع إنشاء أسئلة من النص");
 AI.questions=result;AI.index=0;AI.score=0;AI.selected=-1;draw();
}
function renderQuestions(){
 const q=AI.questions[AI.index];if(!AI.questions.length)return "";
 if(!q)return `<div class="card"><h3>النتيجة: ${AI.score}/${AI.questions.length}</h3><button class="btn" onclick="addQuestionsToReview()">إضافة الأسئلة للمراجعة</button></div>`;
 return `<div class="card"><p class="muted">${AI.index+1}/${AI.questions.length}</p>
 <h3>${esc(q.question)}</h3>
 ${q.options.map((o,i)=>`<button class="tile" style="margin:5px 0" onclick="answerQuestion(${i})">${esc(o)}</button>`).join("")}
 ${AI.selected>=0?`<button class="btn" onclick="nextQuestion()">التالي</button>`:""}</div>`;
}
function answerQuestion(i){
 if(AI.selected>=0)return;AI.selected=i;
 if(i===AI.questions[AI.index].correct)AI.score++;
 draw();
}
function nextQuestion(){AI.index++;AI.selected=-1;draw()}
function addQuestionsToReview(){
 AI.questions.forEach(q=>D.lessons.push({
  id:String(Date.now()+Math.random()),subject:SUBJECT,
  title:q.question,answer:q.options[q.correct],box:0,next:dayNumber()+1
 }));
 AI.questions=[];save();draw();
}

/* المؤقت */

function formatTime(sec){
 sec=Math.max(0,Math.floor(sec));
 return Math.floor(sec/3600)+":"+String(Math.floor(sec%3600/60)).padStart(2,"0");
}
function elapsedToday(){
 let total=D.sessions.filter(s=>s.day===todayKey()).reduce((a,s)=>a+s.seconds,0);
 if(D.activeTimer&&D.timerDay===todayKey())total+=Math.floor((Date.now()-D.activeTimer)/1000);
 return total;
}
function elapsedWeek(){
 const start=dayNumber()-6;
 return D.sessions.filter(s=>dayNumber(new Date(s.day+"T12:00:00"))>=start).reduce((a,s)=>a+s.seconds,0);
}
function currentTimer(){
 return D.activeTimer?formatTime((Date.now()-D.activeTimer)/1000):"00:00";
}
function timerPage(){
 clearInterval(timerInterval);
 if(D.activeTimer)timerInterval=setInterval(()=>{
  const el=$("timerDisplay");if(el)el.textContent=currentTimer();
 },1000);
 return header(t("timer"))+`
 <div class="card">
 <div class="timer" id="timerDisplay">${currentTimer()}</div>
 <button class="btn" onclick="toggleTimer()">${D.activeTimer?t("stop"):t("start")}</button>
 </div>
 <div class="stats card">
 <div><b>${formatTime(elapsedToday())}</b>${t("today")}</div>
 <div><b>${formatTime(elapsedWeek())}</b>آخر 7 أيام</div>
 <div><b>${D.goal}h</b>${t("goal")}</div>
 </div>`;
}
function toggleTimer(){
 if(D.activeTimer){
  const seconds=Math.max(0,Math.floor((Date.now()-D.activeTimer)/1000));
  D.sessions.push({day:D.timerDay||todayKey(),seconds});
  D.activeTimer=0;D.timerDay="";
 }else{D.activeTimer=Date.now();D.timerDay=todayKey()}
 save();draw();
}

/* المهام */

function tasksPage(){
 return header(t("tasks"))+`
 <div class="card">
 <input id="taskTitle" placeholder="${t("newTask")}">
 <select id="taskSubject">${subjects().map(s=>`<option value="${s[0]}">${s[1]}</option>`).join("")}</select>
 <button class="btn" onclick="addTask()">${t("add")}</button>
 </div>
 ${D.tasks.length?D.tasks.map((x,i)=>`
 <div class="card row" style="align-items:center">
 <button class="btn light" style="flex:none" onclick="toggleTask(${i})">${x.done?"✓":"○"}</button>
 <div style="flex:1" class="${x.done?"done":""}">${esc(x.title)}<div class="muted">${esc(subjectName(x.subject))}</div></div>
 <button class="btn red" style="flex:none" onclick="deleteTask(${i})">🗑</button>
 </div>`).join(""):`<p class="muted">${t("noTasks")}</p>`}`;
}
function addTask(){
 const title=$("taskTitle").value.trim();if(!title)return;
 D.tasks.unshift({title,subject:$("taskSubject").value,done:false});save();draw();
}
function toggleTask(i){D.tasks[i].done=!D.tasks[i].done;save();draw()}
function deleteTask(i){D.tasks.splice(i,1);save();draw()}

/* الإعدادات والنسخ */

function settingsPage(){
 return header(t("settings"))+`
 <div class="card">
 <label>${t("student")}</label><input value="${esc(D.name)}" onchange="D.name=this.value;save()">
 <label>${t("exam")}</label><input type="date" value="${esc(D.exam)}" onchange="D.exam=this.value;save();draw()">
 <label>${t("goal")}</label><input type="number" min="1" max="14" value="${D.goal}" onchange="D.goal=Math.max(1,Math.min(14,Number(this.value)||3));save()">
 </div>
 <div class="card">
 <label>${t("font")}</label>
 <select onchange="D.font=this.value;save();draw()">
 ${Object.keys(FONTS).map(k=>`<option value="${k}" ${D.font===k?"selected":""}>${FONTS[k][0]}</option>`).join("")}
 </select>
 <label>${t("fontSize")}</label>
 <select onchange="D.fontSize=Number(this.value);save();draw()">
 <option value=".9" ${D.fontSize===.9?"selected":""}>صغير</option>
 <option value="1" ${D.fontSize===1?"selected":""}>متوسط</option>
 <option value="1.1" ${D.fontSize===1.1?"selected":""}>كبير</option>
 <option value="1.2" ${D.fontSize===1.2?"selected":""}>كبير جداً</option>
 </select>
 <label>${t("theme")}</label>
 <select onchange="D.theme=this.value;save();draw()">
 <option value="dark" ${D.theme==="dark"?"selected":""}>داكن</option>
 <option value="light" ${D.theme==="light"?"selected":""}>فاتح</option>
 </select>
 <label>${t("speed")}</label>
 <select onchange="D.rate=Number(this.value);save()">
 <option value=".8">بطيئة</option><option value="1">عادية</option><option value="1.2">سريعة</option>
 </select>
 </div>
 <div class="card">
 <h3>${t("backup")}</h3><p class="muted">${t("backupNote")}</p>
 <div class="row">
 <button class="btn" onclick="exportBackup()">${t("export")}</button>
 <button class="btn light" onclick="$('importFile').click()">${t("import")}</button>
 </div>
 <input type="file" id="importFile" accept=".json,application/json" hidden onchange="importBackup(this)">
 </div>
 <div class="card">
 <h3>${t("editor")}</h3><p class="muted">${t("editorNote")}</p>
 <button class="btn light" onclick="toggleEditor()">${D.editor?"إيقاف":"تفعيل"}</button>
 </div>
 <button class="btn light" onclick="changeBranch()">تغيير الفرع</button>`;
}
function downloadJSON(data,name){
 const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
 const url=URL.createObjectURL(blob),a=document.createElement("a");
 a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function exportBackup(){downloadJSON(D,"ELITE-backup.json")}
function importBackup(input){
 const file=input.files?.[0];if(!file)return;
 const r=new FileReader();
 r.onload=()=>{
  try{
   const x=JSON.parse(r.result);
   if(!x||typeof x!=="object")throw Error();
   if(!confirm("استيراد النسخة؟ قد تستبدل البيانات الحالية."))return;
   D=normalize(x);save();draw();
  }catch(e){alert("ملف النسخة غير صالح")}
 };
 r.readAsText(file);input.value="";
}
function toggleEditor(){D.editor=!D.editor;save();draw()}
function changeBranch(){
 if(!confirm("تغيير الفرع؟"))return;
 D.branch="";save();draw();
}

/* تحميل محتوى رسمي اختياري */

async function loadOfficial(){
 try{
  const res=await fetch("./content.json",{cache:"no-store"});
  if(!res.ok)return;
  const data=await res.json();
  if(!data.research||typeof data.research!=="object")return;
  for(const subject in data.research){
   if(!Array.isArray(data.research[subject]))continue;
   const mine=(D.research[subject]||[]).filter(x=>!x.official);
   const official=data.research[subject].map((x,i)=>({
    id:String(x.id||subject+"-official-"+i),
    title:String(x.title||""),text:String(x.text||""),official:true
   }));
   D.research[subject]=[...mine,...official];
  }
  save();
 }catch(e){console.log("No official content file")}
}

draw();
loadOfficial();

if("serviceWorker" in navigator){
 window.addEventListener("load",()=>{
  navigator.serviceWorker.register("./sw.js").catch(()=>{});
 });
}
