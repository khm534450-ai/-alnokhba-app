  "id": "./",
  "name": "ELITE | النخبة التعليمية",
  "short_name": "النخبة",
  "lang": "ar",
  "dir": "rtl",
  "start_url": "./",
  "scope": "./",
  "display": "standalone",
  "orientation": "portrait",
  "background_color": "#080808",
  "theme_color": "#080808",
